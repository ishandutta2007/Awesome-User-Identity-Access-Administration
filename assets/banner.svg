<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.35; }
      }
      @keyframes floatParticle1 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-30px) translateX(20px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes floatParticle2 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
        50% { transform: translateY(35px) translateX(-25px); opacity: 0.9; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbitRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes badgePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(56,189,248,0.4)); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 12px rgba(129,140,248,0.7)); }
      }

      .grid-layer { animation: pulseGrid 6s ease-in-out infinite; }
      .p1 { animation: floatParticle1 7s ease-in-out infinite; }
      .p2 { animation: floatParticle2 9s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 12, 12; animation: flowDash 3s linear infinite; }
      .orbit-group { transform-origin: 1040px 190px; animation: orbitRing 25s linear infinite; }
      .badge-glow { animation: badgePulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Geometric Grid Pattern (Subtle & Dynamic) -->
  <g class="grid-layer" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.12">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
  </g>

  <!-- Glowing Background Orbs (Non-obstructing, behind content) -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#neonGlow)" />
  <circle cx="1060" cy="200" r="180" fill="#818cf8" opacity="0.14" filter="url(#neonGlow)" />
  <circle cx="580" cy="380" r="160" fill="#c084fc" opacity="0.10" filter="url(#neonGlow)" />

  <!-- Animated Data Flow Lines (Dynamic Architecture in Background) -->
  <g fill="none" opacity="0.4">
    <path class="flow-line" d="M 60,330 C 300,310 400,370 700,330 C 950,290 1050,340 1140,260" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M 100,90 C 400,60 550,140 850,90 C 1000,60 1100,100 1180,140" stroke="#818cf8" stroke-width="2" />
  </g>

  <!-- Floating Ambient Particles -->
  <g class="p1">
    <circle cx="280" cy="90" r="4" fill="#38bdf8" opacity="0.8" />
    <circle cx="750" cy="70" r="3" fill="#818cf8" opacity="0.7" />
    <circle cx="940" cy="320" r="5" fill="#c084fc" opacity="0.6" />
    <circle cx="180" cy="360" r="3.5" fill="#38bdf8" opacity="0.6" />
  </g>
  <g class="p2">
    <circle cx="140" cy="260" r="4.5" fill="#818cf8" opacity="0.7" />
    <circle cx="490" cy="60" r="3" fill="#38bdf8" opacity="0.5" />
    <circle cx="820" cy="370" r="4" fill="#c084fc" opacity="0.8" />
    <circle cx="1120" cy="90" r="5" fill="#38bdf8" opacity="0.7" />
  </g>

  <!-- Right Side Decorative Graphic: IAM Security & Access Hub (stays in background of title) -->
  <g class="orbit-group" opacity="0.55">
    <circle cx="1040" cy="190" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,8" />
    <circle cx="1040" cy="190" r="75" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="8,6" />
    <circle cx="1040" cy="190" r="40" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="1150" cy="190" r="6" fill="#38bdf8" />
    <circle cx="1040" cy="115" r="5" fill="#818cf8" />
    <circle cx="965" cy="190" r="7" fill="#c084fc" />
    <circle cx="1040" cy="265" r="5" fill="#38bdf8" />
  </g>

  <!-- Shield & Key Emblem Icon at Orbit Center -->
  <g transform="translate(1015, 165)" opacity="0.85" filter="url(#softShadow)">
    <path d="M 25,0 L 48,10 L 48,28 C 48,43 38,55 25,60 C 12,55 2,43 2,28 L 2,10 Z" fill="url(#glowGrad)" stroke="url(#primaryGrad)" stroke-width="2.5" />
    <!-- Keyhole -->
    <circle cx="25" cy="25" r="6" fill="#ffffff" />
    <path d="M 22.5,27 L 27.5,27 L 29,42 L 21,42 Z" fill="#ffffff" />
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed sharp, prominent, and readable -->

  <!-- Top Pill / Category Tag -->
  <g class="badge-glow" transform="translate(70, 48)">
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="1.5" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" letter-spacing="1.2">CURATED ENTERPRISE IAM &amp; IGA</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(70, 135)" filter="url(#softShadow)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      User Identity &amp; Access
    </text>
    <text y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Administration
    </text>
  </g>

  <!-- Subtitle / Tagline -->
  <text x="72" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    The comprehensive directory of SaaS &amp; Open-Source IAM, CIAM, PAM, and IGA solutions.
  </text>
  <text x="72" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b">
    SSO • Multi-Factor Auth (MFA) • RBAC/ABAC • SCIM Provisioning • Directory Services • Zero Trust
  </text>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(70, 310)">
    <!-- Pill 1: Keycloak & OSS -->
    <rect x="0" y="0" width="145" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🔓 Open Source</text>

    <!-- Pill 2: SaaS & Enterprise -->
    <rect x="160" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="174" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🏢 Enterprise SaaS</text>

    <!-- Pill 3: Self-Hosted -->
    <rect x="340" y="0" width="150" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="354" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">⚡ Self-Hosted</text>

    <!-- Pill 4: Zero Standing Privileges -->
    <rect x="505" y="0" width="175" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="519" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🛡️ Zero Trust &amp; PAM</text>
  </g>

  <!-- Outer Glowing Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.6" />
</svg>
